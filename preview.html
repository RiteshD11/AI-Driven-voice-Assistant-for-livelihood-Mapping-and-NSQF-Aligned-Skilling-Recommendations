                    <strong>उन्नति सहायक:</strong> नमस्ते! आप किस कक्षा तक पढ़े हैं और आपको किस तरह का काम पसंद है?
                  </div>
                  {spokenText && (
                    <div className="p-3 bg-blue-900 text-white rounded-xl text-xs shadow-sm max-w-[85%] ml-auto">
                      <strong>आप (वॉयस इनपुट):</strong> "{spokenText}"
                    </div>
                  )}
                </div>

                {/* Large Microphone Button */}
                <div className="gov-card p-6 text-center space-y-4">
                  <div className="flex justify-center">
                    <button
                      onClick={startVoiceDemo}
                      className={`w-28 h-28 rounded-full flex flex-col items-center justify-center font-bold shadow-xl transition-all ${
                        isListening ? 'bg-amber-500 text-slate-950 pulse-mic' : 'bg-blue-900 hover:bg-blue-800 text-white'
                      }`}
                    >
                      <span className="text-3xl">🎤</span>
                      <span className="text-xs mt-1">{isListening ? 'सुन रहे हैं...' : 'बोलने के लिए दबाएं'}</span>
                    </button>
                  </div>
                  <div className="text-xs font-semibold text-slate-600">
                    {statusMsg || 'माइक बटन दबाएं या डेमो वॉयस चलाएं'}

                  <div className="flex justify-center gap-2 pt-2">
                    <button onClick={startVoiceDemo} className="bg-amber-100 hover:bg-amber-200 text-amber-900 text-xs px-3 py-1.5 rounded-lg font-bold border border-amber-300">
                      🎯 डेमो वॉयस नमूना चलाएं
                    </button>
                  </div>
                </div>

                {/* AI Extracted Information & Confirmation */}
                {extracted && (
                  <div className="gov-card p-5 border-2 border-indigo-200 bg-indigo-50/50 space-y-4">
                    <div className="flex justify-between items-center border-b border-indigo-100 pb-2">
                      <h4 className="font-bold text-xs text-indigo-950 flex items-center gap-1.5">
                        <span>✨ एआई निष्कर्षित जानकारी (AI Extracted Information)</span>
                      </h4>
                      <span className="text-[10px] bg-indigo-200 text-indigo-900 px-2 py-0.5 rounded font-bold">सटीकता: 95%</span>
                    </div>

                    <div className="grid grid-cols-2 gap-2 text-xs">
                      <div className="p-2.5 bg-white rounded-lg border border-slate-200">
                        <span className="text-slate-400 text-[10px] font-bold block">शिक्षा (Education)</span>
                        <strong className="text-slate-900">{extracted.education}</strong>
                      </div>
                      <div className="p-2.5 bg-white rounded-lg border border-slate-200">
                        <span className="text-slate-400 text-[10px] font-bold block">कौशल (Skills)</span>
                        <strong className="text-slate-900">{extracted.skills.join(', ')}</strong>
                      </div>
                      <div className="p-2.5 bg-white rounded-lg border border-slate-200">
                        <span className="text-slate-400 text-[10px] font-bold block">रुचि (Interest)</span>
                        <strong className="text-slate-900">{extracted.interest}</strong>
                      </div>
                      <div className="p-2.5 bg-white rounded-lg border border-slate-200">
                        <span className="text-slate-400 text-[10px] font-bold block">प्राथमिकता (Preference)</span>
                        <strong className="text-slate-900">{extracted.pref}</strong>
                      </div>
                    </div>

                    <div className="p-3 bg-amber-50 rounded-lg border border-amber-200 flex items-center justify-between gap-2 text-xs">
                      <span className="font-semibold text-amber-900">क्या यह जानकारी सही है?</span>
                      <div className="flex gap-2">
                        <button onClick={() => setPage('profile')} className="px-3 py-1.5 bg-white border border-slate-300 text-slate-700 rounded-md font-semibold">सुधार करें</button>
                        <button onClick={() => setPage('profile')} className="px-4 py-1.5 bg-blue-900 text-white rounded-md font-bold shadow">पुष्टि करें (Confirm) →</button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 3. PROFILE PAGE */}
            {page === 'profile' && (
              <div className="space-y-6">
                <div className="gov-card p-6 bg-gradient-to-r from-blue-900 to-slate-900 text-white flex flex-col md:flex-row justify-between items-center gap-4">
                  <div className="flex items-center gap-4">
                    <div className="w-14 h-14 rounded-xl bg-amber-500 text-slate-950 font-black text-2xl flex items-center justify-center">
                      र
                    </div>
                    <div>
                      <h2 className="text-xl font-bold">{profile.name}</h2>
                      <p className="text-xs text-slate-300">आयु: {profile.age} वर्ष | {profile.district}, {profile.state}</p>

                  </div>
                  <div className="bg-slate-800/90 p-3 rounded-xl border border-slate-700 min-w-[200px]">

                      <span>प्रोफ़ाइल पूर्णता</span>
                      <span className="text-amber-400">{profile.completion}%</span>
                    </div>
                    <div className="w-full bg-slate-700 rounded-full h-2">
                      <div className="bg-amber-400 h-2 rounded-full" style={{ width: `${profile.completion}%` }}></div>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                  <div className="gov-card p-4 space-y-2">
                    <h4 className="font-bold text-slate-900 border-b pb-1">शैक्षणिक योग्यता</h4>
                    <p className="font-semibold text-slate-800">{profile.education}</p>
                    <span className="text-[11px] text-slate-500 block">कला/विज्ञान संकाय</span>
                  </div>
                  <div className="gov-card p-4 space-y-2">
                    <h4 className="font-bold text-slate-900 border-b pb-1">मौजूदा कौशल</h4>
                    <div className="flex flex-wrap gap-1">
                      {profile.skills.map((s, i) => (
                        <span key={i} className="bg-slate-100 text-slate-800 px-2 py-0.5 rounded font-medium">{s}</span>
                      ))}
                    </div>
                  </div>
                  <div className="gov-card p-4 space-y-2">
                    <h4 className="font-bold text-slate-900 border-b pb-1">आजीविका रुचि व प्राथमिकता</h4>
                    <p className="font-semibold text-slate-800">{profile.interests.join(', ')}</p>
                    <span className="text-[11px] text-emerald-700 font-bold block">{profile.jobPref}</span>
                  </div>
                </div>

                <div className="flex justify-end gap-2">
                  <button onClick={() => setPage('gap')} className="px-5 py-2.5 bg-blue-900 text-white rounded-lg text-xs font-bold shadow">
                    कौशल अंतर विश्लेषण (Skill Gap) देखें →
                  </button>
                </div>
              </div>
            )}

            {/* 4. SKILL GAP ANALYSIS */}
            {page === 'gap' && (

                <div className="text-center space-y-1">

                  <h2 className="text-2xl font-bold text-slate-900">आपके वर्तमान कौशल बनाम लक्षित कार्य</h2>

                <div className="gov-card p-6 bg-slate-900 text-white space-y-3">
                  <div className="flex justify-between items-center">
                    <div>
                      <span className="text-xs text-amber-400 font-bold">NSQF Level 5 संरेखित</span>
                      <h3 className="text-lg font-bold">वेब एवं डिजिटल फ्रंट-एंड डेवलपर</h3>

                    <div className="text-right">

                  <div className="w-full bg-slate-800 rounded-full h-2.5">

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">

                    <h4 className="font-bold text-xs text-emerald-800">✓ आपके वर्तमान कौशल (Current Skills)</h4>
                    <div className="space-y-1 text-xs">
                      <div className="p-2 bg-emerald-50 rounded text-emerald-950 font-semibold">✓ Basic Computer (आधारभूत कंप्यूटर)</div>
                      <div className="p-2 bg-emerald-50 rounded text-emerald-950 font-semibold">✓ MS Office & Data Entry</div>
                    </div>
                  </div>

                  <div className="gov-card p-4 space-y-2 border-t-4 border-t-amber-500">

                      <div className="p-2 bg-amber-50 rounded text-amber-950 font-semibold">○ React UI Fundamentals</div>
                    </div>
                  </div>
                </div>

                <div className="gov-card p-4 bg-indigo-50 border border-indigo-200 flex justify-between items-center gap-3">
                  <div>
                    <span className="text-[11px] font-bold text-indigo-700">सुझाया गया अगला कौशल:</span>
                    <h4 className="text-sm font-bold text-slate-900">HTML & CSS Web Fundamentals</h4>
                  </div>
                  <button onClick={() => setPage('training')} className="px-4 py-2 bg-blue-900 text-white rounded-lg text-xs font-bold shadow">
                    अनुशंसित कोर्स देखें →
                  </button>
                </div>
              </div>
            )}

            {/* 5. TRAINING RECOMMENDATIONS */}
            {page === 'training' && (

                <div className="text-center space-y-1">

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {courses.map(c => (
                    <div key={c.id} className="gov-card p-5 space-y-3 flex flex-col justify-between">
                      <div>
                        <div className="flex justify-between items-start">

                        <h3 className="font-bold text-sm text-slate-900 mt-1">{c.name}</h3>
                        <p className="text-[11px] text-slate-500">{c.level} | {c.duration} | {c.location}</p>

                        <div className="pt-2">
                          <span className="text-[10px] font-bold text-slate-600 block mb-1">मैच का कारण:</span>
                          <ul className="text-[11px] text-slate-600 space-y-1">
                            {c.reasons.map((r, i) => <li key={i}>{r}</li>)}
                          </ul>
                        </div>
                      </div>

                      <div className="pt-2 border-t flex gap-2">
                        <button onClick={() => alert(`'${c.name}' हेतु रुचि दर्ज की गई (डेमो)`)} className="flex-1 py-2 bg-blue-900 text-white rounded text-xs font-bold">

                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="flex justify-end">
                  <button onClick={() => setPage('livelihood')} className="px-5 py-2.5 bg-amber-500 text-slate-950 rounded-lg text-xs font-bold shadow">
                    आजीविका मानचित्रण (Livelihood Map) देखें →
                  </button>
                </div>
              </div>
            )}

            {/* 6. LIVELIHOOD MAP */}
            {page === 'livelihood' && (
              <div className="space-y-6">
                <div className="text-center space-y-1">
                  <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded">आजीविका मानचित्रण</span>
                  <h2 className="text-2xl font-bold text-slate-900">कौशल से रोजगार व स्वरोजगार तक</h2>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="gov-card p-6 border-t-4 border-t-blue-900 space-y-3">
                    <span className="text-xs font-bold text-blue-900 bg-blue-50 px-2 py-0.5 rounded">मार्ग अ: संगठित रोजगार</span>
                    <h3 className="text-base font-bold text-slate-900">Junior Web & Portal Associate</h3>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      प्रशिक्षण समाप्ति उपरांत स्थानीय आईटी कंपनियों, डिजिटल सेवा प्रदाताओं या स्कूलों में नौकरी।
                    </p>
                    <div className="p-3 bg-slate-50 rounded text-xs font-bold text-emerald-700">
                      मासिक वेतन: ₹14,000 - ₹18,000
                    </div>
                    <button onClick={() => setPage('jobs')} className="w-full py-2 bg-blue-900 text-white rounded text-xs font-bold">
                      नौकरियां देखें
                    </button>
                  </div>

                  <div className="gov-card p-6 border-t-4 border-t-emerald-600 space-y-3">
                    <span className="text-xs font-bold text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded">मार्ग ब: स्वरोजगार / सीएससी कियोस्क</span>
                    <h3 className="text-base font-bold text-slate-900">Digital CSC Kiosk Entrepreneur</h3>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      गाँव में स्वयं का ग्राहक सेवा केंद्र खोलकर सरकारी योजनाओं और ऑनलाइन सेवाओं से आय।
                    </p>
                    <div className="p-3 bg-slate-50 rounded text-xs font-bold text-emerald-700">
                      मासिक लाभ: ₹18,000 - ₹30,000 (मुद्रा ऋण सहायता)
                    </div>
                    <button onClick={() => setPage('jobs')} className="w-full py-2 bg-emerald-800 text-white rounded text-xs font-bold">
                      स्वरोजगार अवसर देखें
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 7. JOBS & OPPORTUNITIES */}
            {page === 'jobs' && (
              <div className="space-y-6">
                <div className="text-center space-y-1">
                  <span className="text-xs font-bold text-blue-900 bg-blue-50 px-2.5 py-0.5 rounded">अवसर निर्देशिका</span>
                  <h2 className="text-2xl font-bold text-slate-900">स्थानीय रोजगार एवं स्वरोजगार अवसर</h2>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {opportunities.map((opp, idx) => (
                    <div key={idx} className="gov-card p-5 space-y-3 flex flex-col justify-between">
                      <div>
                        <span className="text-[10px] font-bold bg-amber-100 text-amber-900 px-2 py-0.5 rounded">{opp.type}</span>
                        <h3 className="font-bold text-sm text-slate-900 mt-1">{opp.title}</h3>
                        <p className="text-xs text-slate-600 mt-1">{opp.desc}</p>
                        <div className="mt-2 text-xs font-bold text-emerald-700">{opp.wage}</div>
                        <span className="text-[11px] text-slate-400 block mt-0.5">स्थान: {opp.location}</span>
                      </div>
                      <button onClick={() => alert(`'${opp.title}' हेतु आवेदन दर्ज हुआ (डेमो)`)} className="w-full py-2 bg-blue-900 text-white text-xs font-bold rounded">
                        आवेदन विवरण देखें
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 8. ADMIN DASHBOARD */}
            {page === 'admin' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <div>
                    <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-2.5 py-0.5 rounded">प्रशासनिक डैशबोर्ड</span>
                    <h2 className="text-2xl font-bold text-slate-900">अनामीकृत कौशल एवं आजीविका विश्लेषण</h2>
                  </div>
                  <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded border border-emerald-200">k-Anonymity सुरक्षित</span>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                  <div className="gov-card p-4">
                    <span className="text-slate-500 text-xs">कुल लाभार्थी</span>
                    <div className="text-2xl font-bold text-slate-900">14,820</div>
                  </div>
                  <div className="gov-card p-4">
                    <span className="text-slate-500 text-xs">सक्रिय वॉयस यूजर</span>
                    <div className="text-2xl font-bold text-blue-900">3,840</div>
                  </div>
                  <div className="gov-card p-4">
                    <span className="text-slate-500 text-xs">स्किल गैप विश्लेषित</span>
                    <div className="text-2xl font-bold text-indigo-700">9,740</div>
                  </div>
                  <div className="gov-card p-4">
                    <span className="text-slate-500 text-xs">आजीविका सृजन</span>
                    <div className="text-2xl font-bold text-emerald-700">4,210</div>
                  </div>
                </div>

                <div className="gov-card p-5 space-y-3">
                  <h4 className="font-bold text-xs text-slate-800">शीर्ष कौशल मांग (पूर्वांचल ज़ोन)</h4>
                  <div className="space-y-2 text-xs">
                    <div>
                      <div className="flex justify-between font-semibold"><span>Basic Computer & Typing</span><span>33%</span></div>
                      <div className="w-full bg-slate-100 rounded-full h-2"><div className="bg-blue-900 h-2 rounded-full" style={{ width: '80%' }}></div></div>
                    </div>
                    <div>
                      <div className="flex justify-between font-semibold"><span>Traditional Agriculture</span><span>25%</span></div>
                      <div className="w-full bg-slate-100 rounded-full h-2"><div className="bg-blue-900 h-2 rounded-full" style={{ width: '60%' }}></div></div>
                    </div>
                    <div>
                      <div className="flex justify-between font-semibold"><span>Domestic Electrical Wiring</span><span>15%</span></div>
                      <div className="w-full bg-slate-100 rounded-full h-2"><div className="bg-blue-900 h-2 rounded-full" style={{ width: '38%' }}></div></div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 9. HELP & ACCESSIBILITY */}
            {page === 'help' && (
              <div className="max-w-2xl mx-auto space-y-6">
                <div className="text-center space-y-1">
                  <span className="text-xs font-bold text-blue-900 bg-blue-50 px-2 py-0.5 rounded">सुगमता एवं सहायता</span>
                  <h2 className="text-2xl font-bold text-slate-900">पोर्टल उपयोग मार्गदर्शिका</h2>
                </div>

                <div className="gov-card p-5 space-y-3 text-xs text-slate-700">
                  <h4 className="font-bold text-sm text-slate-900 border-b pb-1">वॉयस इनपुट टिप्स</h4>
                  <p>1. माइक बटन दबाकर शांत वातावरण में बोलें।</p>
                  <p>2. यदि माइक काम न करे, तो 'डेमो वॉयस नमूना चलाएं' बटन का उपयोग करें।</p>

                </div>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="bg-slate-950 text-slate-400 text-xs py-8 px-4 border-t border-slate-800 mt-12">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 text-center sm:text-left">
              <div>
                <span className="text-white font-bold text-sm block">UNNATI (उन्नति) | SIH 2026</span>
                <span className="text-slate-500 text-[11px]">PM-AJAY, NSQF, Skill India Digital एवं Bhashini संरेखित नवाचार प्रोटोटाइप</span>
              </div>
              <div className="text-[11px] text-slate-500">
                © 2026 Smart India Hackathon Prototype | Developed by Team UNNATI
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
